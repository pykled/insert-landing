<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>Insert — OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
    }

    /* Grid background */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Subtle radial fade to darken edges */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    /* Wordmark */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .wordmark-square {
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Center content */
    .center {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 820px;
    }

    .headline {
      font-size: 72px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .subtitle {
      font-size: 28px;
      font-weight: 400;
      color: #9a9a96;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }

    /* Bottom bar */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .bottom-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rule {
      width: 200px;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }

    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .domain {
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      color: #9a9a96;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="vignette"></div>

  <div class="container">
    <!-- Top-left wordmark -->
    <div class="wordmark">
      <div class="wordmark-square"></div>
      Insert
    </div>

    <!-- Center headline -->
    <div class="center">
      <div class="headline">AI Workflows for<br>Serious Businesses</div>
      <div class="subtitle">Stop paying your team to do busywork.</div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom">
      <div class="bottom-left">
        <div class="rule"></div>
        <div class="tagline">AI Consulting &amp; Automation</div>
      </div>
      <div class="domain">useinsert.com</div>
    </div>
  </div>
</body>
</html>
